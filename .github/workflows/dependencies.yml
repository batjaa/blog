name: Dependency checks

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            newsletter/package-lock.json
      - run: npm ci
      - run: npm --prefix newsletter ci
      - run: npm audit
      - run: npm --prefix newsletter audit
      - run: npm test
      - run: npm --prefix newsletter test
      - run: npm --prefix newsletter run typecheck
      - run: npm run css:build
      - run: npm run newsletter:build
