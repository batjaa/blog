name: Newsletter

on:
  # Auto-build when newsletter content changes
  push:
    branches: [master, main]
    paths:
      - 'newsletter/issues/**'
      - 'newsletter/templates/**'
      - 'newsletter/scripts/**'

  # Manual trigger for sending
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - build-only
          - send-test
          - send-broadcast
        default: 'build-only'
      issue:
        description: 'Issue to send (e.g. 2026-03). Defaults to latest built issue.'
        required: false
        type: string
      send_interval_seconds:
        description: 'Seconds between recipients (1–300; default 6 = at most 10/minute)'
        required: false
        default: '6'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: newsletter/package-lock.json

      - name: Install dependencies
        run: cd newsletter && npm ci

      - name: Build newsletter
        run: npm run newsletter:build
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}

      - name: Test newsletter
        run: npm --prefix newsletter test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-html
          path: newsletter/dist/*.html

      - name: Summary
        run: |
          echo "## Newsletter Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "**Trigger:** Push to ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Trigger:** Manual (${{ github.event.inputs.action }})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built Issues" >> $GITHUB_STEP_SUMMARY
          ls -1 newsletter/dist/*.html | xargs -I {} basename {} | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

  send:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'build-only'
    concurrency:
      group: newsletter-send
      cancel-in-progress: false
    env:
      NEWSLETTER_ISSUE: ${{ inputs.issue }}
      NEWSLETTER_SEND_INTERVAL_SECONDS: ${{ inputs.send_interval_seconds || '6' }}
      NEWSLETTER_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: newsletter/package-lock.json

      - name: Install dependencies
        run: cd newsletter && npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: newsletter-html
          path: newsletter/dist

      - name: Send test email
        if: github.event.inputs.action == 'send-test'
        working-directory: newsletter
        run: |
          args=(--test)
          if [ -n "$NEWSLETTER_ISSUE" ]; then args+=("--issue=$NEWSLETTER_ISSUE"); fi
          npx tsx scripts/send.ts "${args[@]}"
        env:
          POSTMARK_API_KEY: ${{ secrets.POSTMARK_API_KEY }}
          TEST_EMAIL_ADDRESS: ${{ secrets.TEST_EMAIL_ADDRESS }}
          NEWSLETTER_TOKEN_SECRET: ${{ secrets.NEWSLETTER_TOKEN_SECRET }}
          NEWSLETTER_FROM_EMAIL: ${{ secrets.NEWSLETTER_FROM_EMAIL }}
          SITE_URL: https://batjaa.com

      - name: Send to all subscribers
        if: github.event.inputs.action == 'send-broadcast'
        working-directory: newsletter
        run: |
          args=(--broadcast)
          if [ -n "$NEWSLETTER_ISSUE" ]; then args+=("--issue=$NEWSLETTER_ISSUE"); fi
          npx tsx scripts/send.ts "${args[@]}"
        env:
          POSTMARK_API_KEY: ${{ secrets.POSTMARK_API_KEY }}
          NEWSLETTER_FROM_EMAIL: ${{ secrets.NEWSLETTER_FROM_EMAIL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEWSLETTER_TOKEN_SECRET: ${{ secrets.NEWSLETTER_TOKEN_SECRET }}
          SITE_URL: https://batjaa.com

      - name: Send Summary
        if: always()
        run: |
          if compgen -G 'newsletter/reports/*.md' > /dev/null; then
            cat newsletter/reports/*.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Newsletter send did not produce a report' >> "$GITHUB_STEP_SUMMARY"
            echo 'Check the failed setup/send step. Delivery has not been confirmed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload delivery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-delivery-report
          path: newsletter/reports/
          if-no-files-found: warn
          retention-days: 14
