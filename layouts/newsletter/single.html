{{ define "main" }}
<article class="newsletter-content">
    {{ .Content | safeHTML }}
</article>
{{ $photosJS := resources.Get "js/newsletter-photos.js" | minify | fingerprint }}
<script src="{{ $photosJS.RelPermalink }}" integrity="{{ $photosJS.Data.Integrity }}" defer></script>

{{ partial "newsletter/subscribe.html" . }}

<div class="newsletter-archive">
    <a href="{{ .Site.BaseURL }}newsletter/">{{ i18n "newsletter_all" }} →</a>
</div>
{{ end }}
